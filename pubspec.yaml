name: hospital_booking_management
description: "A production-ready Enterprise Hospital Booking Management System."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  get: ^4.6.6
  get_storage: ^2.1.1
  
  # Backend
  supabase_flutter: ^2.5.2
  
  # UI Components
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  
  # Utilities
  intl: ^0.19.0
  logger: ^2.3.0
  dio: ^5.4.3+1
  path_provider: ^2.1.3
  
  # Video Calling
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1
  
  # Payments
  flutter_stripe: ^10.1.1
  
  # Notifications
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
